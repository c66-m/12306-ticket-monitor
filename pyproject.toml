# 12306 车票监控系统 —— 项目元数据与工具配置
#
# 本项目**不打包分发**：Electron 直接 spawn `api.py`，业务代码按运行目录加载
# （见 electron/main.js 与启动桌面版.bat）。因此本文件不声明 [build-system]，
# `pip install .` 不是预期用法；它的作用是统一三件事：
#   1. 声明 Python 版本下限与运行时依赖（与 requirements.txt 保持同源口径）；
#   2. 给 ruff 一个统一的静态检查口径（排除停用代码与产物目录）；
#   3. 给 pytest 一个统一的收集路径（测试仍是 unittest 风格，可直接用
#      `python tests/test_all.py` 跑，不强制安装 pytest）。
#
# 依赖装法：pip install -r requirements.txt（生产） / requirements-dev.txt（开发）

[project]
name = "ticket-12306-monitor"
version = "1.0.0"
description = "12306 车票监控与自动抢票系统（Electron 壳 + Python JSON-RPC 后端）"
readme = "README.md"
requires-python = ">=3.9"          # 代码未使用 match / PEP 604 / 3.11+ 标准库；实测 3.12
dependencies = [
    "requests>=2.33.1,<3",
    "playwright>=1.58.0,<2",
]

[project.optional-dependencies]
# 非 Windows 平台的加密兜底（Windows 走 DPAPI，见 passengers.py）
crypto = ["cryptography>=50.0.2"]
# 开发工具：pytest 只作为 runner，测试本身是纯 unittest
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
target-version = "py39"
line-length = 110                  # 对齐现状（最长行约 105），先不制造噪音
exclude = [
    "legacy",                      # 已停用的 Tkinter 界面
    "electron",                    # Node 侧
    "ui",
    "web-dashboard",
    "data",
    "data_migration_backup",
    "runs",
    ".browser_profile",
    "tools/gen_icon.py",           # 一次性图标生成脚本
    "tools/gen_icon_emoji.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]      # 语法/未定义名/空白/导入顺序
ignore = ["E501"]                  # 行长由 line-length 统一治理，不逐行报

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 测试必须在项目根目录执行：tests 用相对路径读产品文件（见 HANDOFF §12）
